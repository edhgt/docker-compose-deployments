services:
  db:
    image: mariadb:10.11
    container_name: openintranet-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
      MYSQL_DATABASE: openintranet
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal_password_seguro
    volumes:
      - db_data_open_intranet:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - openintranet-network

  web:
    image: drupal:11.3.2-php8.4-apache-bookworm
    container_name: openintranet-web
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - /home/edhernandez/development/projects/php/openintranet:/opt/openintranet
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_NAME: openintranet
      DRUPAL_DB_USER: drupal
      DRUPAL_DB_PASSWORD: drupal_password_seguro
    networks:
      - openintranet-network

volumes:
  db_data_open_intranet:

networks:
  openintranet-network:
